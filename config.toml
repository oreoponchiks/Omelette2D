# Omelette2D runtime configuration. Restart the app after changing this file.

[window]
title = "Omelette2D"
width = 1920
height = 1080
maximized = false

[simulation]
# Options: "empty", "object_demo"
start_scene = "empty"
paused = false
# Simulation advances at this fixed step when using Step; lower values slow the simulation.
tick_rate = 60.0
# Multiplier applied to real-time updates (0 pauses simulation updates without changing the checkbox).
time_scale = 1.0
# Prevents a stalled window from producing a huge physics jump after it resumes.
max_frame_delta = 0.05
# Options: "normal", "heat", "pressure"
view = "normal"

[tools]
# Material names are the same as those shown in the material picker.
material = "Sand"
# Options: "paint", "heat", "cool", "air", "object", "grab"
selected = "paint"
brush_radius = 3
heat_rate = 600.0
cool_rate = 600.0
pressure_rate = 20.0

[ui]
panel_width = 470.0
panel_height = 610.0
